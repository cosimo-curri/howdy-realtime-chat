<!DOCTYPE html>
<html lang="en">
    <head>
        <title>howdy? restore password</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="howdy? restore password">
        <meta name="application-name" content="howdy?">

        <link rel="stylesheet" href="./css/style.css" type="text/css">
        <link rel="stylesheet" href="./css/changePassword.css" type="text/css">
        <link rel="icon" href="./images/logo.png" type="image/png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

        <script src="./js/changePassword.js" defer></script>
    </head>

    <body>
        <div class="container-forgot">
            <h1>Restore Password</h1>
            <span class="span-forgot">enter new password and confirm</span>
    
            <form id="changePasswordForm">
                <div class="infield">
                    <input type="password" name="newPassword1" placeholder="Password" oninput="textChange()" id="myPass" >
                    <div class="label"></div>
                </div>
                <div class="infield">
                    <input type="password" name="newPassword2" placeholder="Confirm Password">
                    <div class="label"></div>
                </div>

                <div class="validator">
                    <p class="pValidator" id="number">
                        <i class="fas fa-times"></i>
                        <i class="fas fa-check"></i>
                        <span class="spanValidator">Number</span>
                    </p>
                    <p class="pValidator" id="capital">
                        <i class="fas fa-times"></i>
                        <i class="fas fa-check"></i>
                        <span class="spanValidator">Upper Case</span>
                    </p>
                    
                    <p class="pValidator" id="special-char">
                        <i class="fas fa-times"></i>
                        <i class="fas fa-check"></i>
                        <span class="spanValidator">Special Character</span>
                    </p>
                    <p class="pValidator" id="more-than-8">
                        <i class="fas fa-times"></i>
                        <i class="fas fa-check"></i>
                        <span class="spanValidator">More than 8 characters</span>
                    </p>
                </div>
                
                <button type="submit" class="btn-forgot">Change</button>           
            </form>
        </div>
        <script src="./js/script.js">
            
        </script>
    </body>
</html>
